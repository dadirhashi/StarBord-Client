server {
    listen 8080;
    server_name _;
    server_tokens off;                 # visa inte nginx-versionen (ger angripare mindre info)

    root /usr/share/nginx/html;
    index index.html;

    # Dockers inbyggda DNS. Med en variabel slås "api" upp på nytt var 10:e sekund,
    # så nya replikor (--scale api=3) hittas och trafiken fördelas mellan dem.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Allt under /api/ skickas vidare till API-containern (reverse proxy)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: okända sökvägar (t.ex. /dashboard) ska ge index.html,
    # annars får man 404 när man laddar om sidan
    location / {
        try_files $uri $uri/ /index.html;
    }
}